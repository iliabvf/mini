<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mini</title>
  <style>
    :root {
      --ink: #1a1612;
      --paper: #f3ead7;
      --panel: #fffaf1;
      --line: #d9cbb3;
      --ember: #d4531a;
      --gold: #e2a01a;
      --moss: #2f6f4e;
      --muted: #7a6d5d;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--paper);
      color: var(--ink);
      font-family: "Palatino Linotype", Palatino, Georgia, serif;
    }
    main {
      height: 100%;
      display: grid;
      grid-template-rows: minmax(0, 1.2fr) minmax(220px, 0.8fr);
    }
    #stage {
      min-height: 0;
      display: grid;
      grid-template-rows: auto 248px minmax(0, 1fr);
      border-bottom: 1px solid var(--line);
      background:
        radial-gradient(circle at 20% 0%, rgba(226, 160, 26, 0.16), transparent 42%),
        var(--paper);
    }
    header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      padding: 14px 22px 0;
    }
    h1 {
      margin: 0;
      font-size: 22px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    #status {
      margin: 0;
      color: var(--muted);
      font-family: Consolas, "Cascadia Mono", monospace;
      font-size: 13px;
    }
    #model-graph { width: 100%; height: 100%; display: block; }
    #stage.show-words {
      grid-template-rows: auto 248px 168px minmax(0, 1fr);
    }
    #vocab {
      display: none;
      min-height: 0;
      grid-template-rows: auto minmax(0, 1fr);
      gap: 6px;
      padding: 8px 22px 10px;
      border-top: 1px solid var(--line);
    }
    #stage.show-words #vocab { display: grid; }
    #vocab-count {
      border: 0;
      background: transparent;
      color: var(--muted);
      font: 13px Consolas, "Cascadia Mono", monospace;
      text-align: left;
      padding: 0;
      cursor: pointer;
    }
    #vocab p {
      margin: 0;
      color: var(--muted);
      font-family: Consolas, "Cascadia Mono", monospace;
      font-size: 13px;
    }
    #vocab-list {
      min-height: 0;
      overflow: auto;
      display: flex;
      flex-wrap: wrap;
      align-content: flex-start;
      gap: 4px;
    }
    .word {
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--ink);
      border-radius: 4px;
      padding: 1px 6px;
      font: 13px Consolas, "Cascadia Mono", monospace;
    }
    .word.special {
      border-color: var(--ember);
      color: var(--ember);
    }
    #sky {
      min-height: 0;
      overflow: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 8px 22px 16px;
    }
    #hint {
      margin: 28px auto;
      color: var(--muted);
      font-size: 16px;
    }
    .star {
      flex: 0 0 auto;
      height: 340px;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
    }
    .star p {
      margin: 0;
      color: var(--muted);
      font-family: Consolas, "Cascadia Mono", monospace;
      font-size: 13px;
    }
    .star canvas { width: 100%; height: 100%; display: block; }
    #chat {
      min-height: 0;
      display: grid;
      grid-template-rows: minmax(0, 1fr) auto;
      background: var(--panel);
    }
    #log {
      overflow: auto;
      padding: 16px 22px 8px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .bubble {
      max-width: 70%;
      padding: 8px 12px;
      line-height: 1.4;
      white-space: pre-wrap;
    }
    .bubble.you {
      align-self: flex-end;
      background: var(--ink);
      color: var(--paper);
    }
    .bubble.mini {
      align-self: flex-start;
      background: #efe2c8;
      border-left: 3px solid var(--moss);
    }
    .bubble.mini.linked {
      outline: 2px solid var(--ember);
    }
    .star { cursor: pointer; }
    form {
      display: flex;
      gap: 8px;
      padding: 12px 22px 16px;
      border-top: 1px solid var(--line);
    }
    input {
      flex: 1;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
      font: 16px Consolas, "Cascadia Mono", monospace;
      padding: 10px 12px;
    }
    button {
      border: 0;
      background: var(--ember);
      color: #fffaf1;
      font: 15px "Palatino Linotype", Palatino, Georgia, serif;
      padding: 0 18px;
      cursor: pointer;
    }
    button.quiet {
      background: transparent;
      color: var(--ink);
      border: 1px solid var(--line);
    }
    button:disabled { opacity: 0.45; cursor: default; }
  </style>
</head>
<body>
  <main>
    <section id="stage">
      <header>
        <h1>Mini</h1>
        <p id="status">Model loaded. Ask something below.</p>
      </header>
      <canvas id="model-graph" aria-label="Model graph"></canvas>
      <section id="vocab" aria-label="Vocabulary" aria-hidden="true">
        <button id="vocab-count" type="button">Vocabulary</button>
        <div id="vocab-list"></div>
      </section>
      <div id="sky">
        <p id="hint">Each reply draws a star. Older stars stay above.</p>
      </div>
    </section>
    <section id="chat">
      <div id="log"></div>
      <form id="form">
        <input id="box" autocomplete="off" placeholder="Say hello" autofocus>
        <button id="reset" class="quiet" type="button">Reset</button>
        <button id="send" type="submit">Send</button>
      </form>
    </section>
  </main>
  <script>
    const sky = document.getElementById("sky");
    const hint = document.getElementById("hint");
    const statusEl = document.getElementById("status");
    const log = document.getElementById("log");
    const form = document.getElementById("form");
    const box = document.getElementById("box");
    const send = document.getElementById("send");
    const reset = document.getElementById("reset");
    const stars = [];

    function setBusy(busy) {
      send.disabled = busy;
      reset.disabled = busy;
    }

    function meanAttention(layers, count) {
      if (!layers.length || !count) return [];
      const heads = layers[layers.length - 1];
      const totals = new Array(count).fill(0);
      heads.forEach((head) => {
        head.slice(-count).forEach((value, index) => { totals[index] += value; });
      });
      return totals.map((value) => value / heads.length);
    }

    function fit(star) {
      const rect = star.canvas.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      const width = Math.max(1, Math.floor(rect.width * dpr));
      const height = Math.max(1, Math.floor(rect.height * dpr));
      if (star.canvas.width !== width || star.canvas.height !== height) {
        star.canvas.width = width;
        star.canvas.height = height;
        star.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }
      return rect;
    }

    function drawStar(star) {
      const rect = fit(star);
      const ctx = star.ctx;
      const width = rect.width;
      const height = rect.height;
      ctx.clearRect(0, 0, width, height);
      const tokens = star.context;
      const attn = star.shown.length === tokens.length ? star.shown : [];
      const band = 58;
      const plotH = Math.max(80, height - band);
      const cx = width * 0.38;
      const cy = plotH * 0.5;
      const radius = Math.min(width * 0.22, plotH * 0.32);
      const count = tokens.length;
      if (!count) {
        ctx.fillStyle = "#7a6d5d";
        ctx.font = "16px Palatino Linotype, Palatino, Georgia, serif";
        ctx.textAlign = "center";
        ctx.fillText("Reading…", cx, cy);
        drawStats(ctx, star, width, height);
        return;
      }
      const peak = Math.max(0.001, ...attn, 0);
      const points = tokens.map((token, index) => {
        const angle = -Math.PI / 2 + (index / count) * Math.PI * 2;
        return {
          token,
          x: cx + Math.cos(angle) * radius,
          y: cy + Math.sin(angle) * radius,
          strength: (attn[index] || 0) / peak,
        };
      });
      if (count >= 5) {
        ctx.beginPath();
        for (let index = 0; index <= count; index++) {
          const point = points[(index * 2) % count];
          if (index === 0) ctx.moveTo(point.x, point.y);
          else ctx.lineTo(point.x, point.y);
        }
        ctx.strokeStyle = "rgba(212, 83, 26, 0.45)";
        ctx.lineWidth = 1.5;
        ctx.stroke();
      }
      points.forEach((point) => {
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.lineTo(point.x, point.y);
        ctx.strokeStyle = `rgba(212, 83, 26, ${0.12 + point.strength * 0.88})`;
        ctx.lineWidth = 1 + point.strength * 8;
        ctx.stroke();
      });
      ctx.fillStyle = "#d4531a";
      ctx.beginPath();
      ctx.arc(cx, cy, 26, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#fffaf1";
      ctx.font = "15px Palatino Linotype, Palatino, Georgia, serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText((star.chosen || "…").replace(/[<>]/g, ""), cx, cy);
      ctx.fillStyle = "#1a1612";
      ctx.font = "13px Consolas, monospace";
      ctx.textBaseline = "middle";
      points.forEach((point) => {
        ctx.fillText(point.token.replace(/[<>]/g, ""), point.x, point.y);
      });
      const barsX = width * 0.68;
      const barMax = width - barsX - 24;
      ctx.textAlign = "left";
      ctx.textBaseline = "alphabetic";
      ctx.font = "13px Consolas, monospace";
      star.probs.slice(0, 6).forEach((item, index) => {
        const yBar = 28 + index * 28;
        ctx.fillStyle = index === 0 ? "#d4531a" : "#e2a01a";
        ctx.fillRect(barsX, yBar, Math.max(2, item.p * barMax), 14);
        ctx.fillStyle = "#1a1612";
        const percent = item.p >= 0.1 ? `${Math.round(item.p * 100)}%` : `${(item.p * 100).toFixed(1)}%`;
        ctx.fillText(`${item.token.replace(/[<>]/g, "")}  ${percent}`, barsX, yBar - 3);
      });
      drawStats(ctx, star, width, height);
    }

    function drawStats(ctx, star, width, height) {
      const stats = star.stats;
      if (!stats) return;
      const top = height - 50;
      ctx.save();
      ctx.fillStyle = "rgba(255, 250, 241, 0.96)";
      ctx.fillRect(8, top, width - 16, 42);
      ctx.strokeStyle = "#d9cbb3";
      ctx.strokeRect(8, top, width - 16, 42);
      ctx.beginPath();
      ctx.rect(14, top, width - 28, 42);
      ctx.clip();
      ctx.fillStyle = "#1a1612";
      ctx.font = "12px Consolas, monospace";
      ctx.textAlign = "left";
      ctx.textBaseline = "alphabetic";
      const parameters = Number(stats.parameters || 0).toLocaleString("en-US");
      ctx.fillText(
        `parameters  ${parameters}    layers ${stats.layers}    heads ${stats.heads}    emb ${stats.embedding}    vocab ${stats.vocab}`,
        16,
        top + 16,
      );
      ctx.fillText(
        `tokens      prompt ${stats.prompt}    generated ${stats.generated}    window ${stats.window} / ${stats.context}`,
        16,
        top + 34,
      );
      ctx.restore();
    }

    function frame() {
      stars.forEach((star) => {
        if (star.target.length) {
          if (star.shown.length !== star.target.length) star.shown = star.target.slice();
          star.shown = star.shown.map((value, index) => value + (star.target[index] - value) * 0.2);
        }
        drawStar(star);
      });
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);

    let replySerial = 0;

    function addStar(question, replyNode) {
      const note = document.getElementById("hint");
      if (note) note.remove();
      const card = document.createElement("article");
      card.className = "star";
      const title = document.createElement("p");
      title.textContent = question;
      const canvas = document.createElement("canvas");
      card.append(title, canvas);
      const replyId = `reply-${replySerial}`;
      replySerial += 1;
      replyNode.id = replyId;
      card.addEventListener("click", () => {
        replyNode.scrollIntoView({ behavior: "smooth", block: "center" });
        replyNode.classList.add("linked");
        window.setTimeout(() => replyNode.classList.remove("linked"), 1200);
      });
      sky.append(card);
      sky.scrollTop = sky.scrollHeight;
      const star = {
        canvas,
        ctx: canvas.getContext("2d"),
        card,
        context: [],
        probs: [],
        chosen: "",
        shown: [],
        target: [],
        stats: null,
      };
      stars.push(star);
      return star;
    }

    function addBubble(kind, text) {
      const node = document.createElement("div");
      node.className = `bubble ${kind}`;
      node.textContent = text;
      log.appendChild(node);
      log.scrollTop = log.scrollHeight;
      return node;
    }

    const queue = [];
    const memory = [];
    const transcript = [];
    const STORAGE_KEY = "mini-session";
    let chain = Promise.resolve();
    const punctuation = new Set([".", "?", "!", ","]);

    function starSnapshot(star) {
      return {
        chosen: star.chosen || "",
        context: star.context.slice(),
        probs: star.probs.slice(0, 6),
        target: star.target.slice(),
        stats: star.stats,
      };
    }

    function showEvent(event, miniBubble, message, star) {
      if (event.stats) star.stats = event.stats;
      if (event.type === "step" && (event.stop || punctuation.has(event.chosen))) {
        if (event.reply) miniBubble.textContent = event.reply;
        if (event.stop) {
          statusEl.textContent = star.chosen
            ? `Holding “${star.chosen}”. That was the last word it chose.`
            : "Reply finished. Ask another question.";
        }
        return Promise.resolve();
      }
      if (event.type === "step") {
        const tokens = (event.context || []).slice(-12);
        star.context = tokens;
        star.probs = event.probs || [];
        star.chosen = event.chosen || "";
        star.target = meanAttention(event.layers || [], tokens.length);
        const looked = tokens
          .map((token, index) => ({ token, weight: star.target[index] || 0 }))
          .sort((a, b) => b.weight - a.weight)[0];
        const top = star.probs[0];
        statusEl.textContent = top
          ? `Choosing “${event.chosen}” at ${(top.p * 100).toFixed(0)}%. Looking most at “${(looked && looked.token) || ""}”.`
          : "Thinking";
        if (event.reply) miniBubble.textContent = event.reply;
        sky.scrollTop = sky.scrollHeight;
        return new Promise((resolve) => setTimeout(resolve, 220));
      }
      if (event.type === "done") {
        miniBubble.textContent = event.reply || miniBubble.textContent;
        if (event.reply) {
          memory.push({ user: message, bot: event.reply });
          if (memory.length > 2) memory.splice(0, memory.length - 2);
          transcript.push({
            user: message,
            bot: event.reply,
            star: starSnapshot(star),
          });
          saveSession();
        }
        statusEl.textContent = star.chosen
          ? `Holding “${star.chosen}”. Ask another question.`
          : "Reply finished. Ask another question.";
        setBusy(false);
        box.focus();
      }
      return Promise.resolve();
    }

    function saveSession() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(transcript));
      } catch (error) {
        statusEl.textContent = "This browser could not keep the chat.";
      }
    }

    function restoreSession() {
      let saved = [];
      try {
        saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
      } catch (error) {
        saved = [];
      }
      if (!Array.isArray(saved) || !saved.length) return;
      saved.forEach((turn) => {
        if (!turn || typeof turn.user !== "string" || typeof turn.bot !== "string") return;
        addBubble("you", turn.user);
        const miniBubble = addBubble("mini", turn.bot);
        const star = addStar(turn.user, miniBubble);
        const snap = turn.star || {};
        star.chosen = snap.chosen || "";
        star.context = Array.isArray(snap.context) ? snap.context : [];
        star.probs = Array.isArray(snap.probs) ? snap.probs : [];
        star.target = Array.isArray(snap.target) ? snap.target : [];
        star.shown = star.target.slice();
        star.stats = snap.stats && typeof snap.stats === "object" ? snap.stats : null;
        transcript.push({
          user: turn.user,
          bot: turn.bot,
          star: starSnapshot(star),
        });
        memory.push({ user: turn.user, bot: turn.bot });
      });
      if (memory.length > 2) memory.splice(0, memory.length - 2);
      sky.scrollTop = sky.scrollHeight;
      log.scrollTop = log.scrollHeight;
      statusEl.textContent = "The last visit is back. Ask another question.";
    }

    function enqueue(event, miniBubble, message, star) {
      queue.push(event);
      chain = chain.then(async () => {
        while (queue.length) await showEvent(queue.shift(), miniBubble, message, star);
      });
      return chain;
    }

    function useBrowserModel() {
      const host = location.hostname;
      const localPython = (host === "127.0.0.1" || host === "localhost") && location.port === "8765";
      return !localPython;
    }

    let brain = null;
    function askBrowser(message, miniBubble, star) {
      if (!brain) brain = new Worker(new URL("infer.js", document.baseURI));
      return new Promise((resolve) => {
        const onMessage = (event) => {
          const data = event.data || {};
          if (data.type === "status") {
            statusEl.textContent = data.text;
            return;
          }
          if (data.type === "error") {
            brain.removeEventListener("message", onMessage);
            miniBubble.textContent = "Something went wrong. Try again.";
            statusEl.textContent = data.message || "The model could not answer.";
            setBusy(false);
            resolve();
            return;
          }
          enqueue(data, miniBubble, message, star);
          if (data.type === "done") {
            brain.removeEventListener("message", onMessage);
            chain.then(resolve);
          }
        };
        brain.addEventListener("message", onMessage);
        brain.postMessage({
          type: "ask",
          message,
          history: memory.slice(-2).map((turn) => ({ user: turn.user, bot: turn.bot })),
        });
      });
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const message = box.value.trim();
      if (!message || send.disabled) return;
      box.value = "";
      setBusy(true);
      addBubble("you", message);
      const miniBubble = addBubble("mini", "…");
      const star = addStar(message, miniBubble);
      statusEl.textContent = "Reading your line.";
      if (useBrowserModel()) {
        await askBrowser(message, miniBubble, star);
        return;
      }
      try {
        const response = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message, history: memory.slice(-2) }),
        });
        if (!response.ok) throw new Error("The model could not answer.");
        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = "";
        while (true) {
          const chunk = await reader.read();
          if (chunk.done) break;
          buffer += decoder.decode(chunk.value, { stream: true });
          const lines = buffer.split("\n");
          buffer = lines.pop();
          lines.forEach((line) => {
            if (line.trim()) enqueue(JSON.parse(line), miniBubble, message, star);
          });
        }
        if (buffer.trim()) enqueue(JSON.parse(buffer), miniBubble, message, star);
        await chain;
      } catch (error) {
        miniBubble.textContent = "Something went wrong. Try again.";
        statusEl.textContent = error.message;
        setBusy(false);
      }
    });

    reset.addEventListener("click", () => {
      if (reset.disabled) return;
      memory.splice(0, memory.length);
      transcript.splice(0, transcript.length);
      try { localStorage.removeItem(STORAGE_KEY); } catch (error) { /* keep clearing the page */ }
      log.replaceChildren();
      stars.splice(0, stars.length);
      sky.replaceChildren();
      const note = document.createElement("p");
      note.id = "hint";
      note.textContent = "Each reply draws a star. Older stars stay above.";
      sky.append(note);
      statusEl.textContent = "Memory cleared. Ask something below.";
      box.focus();
    });

    const stage = document.getElementById("stage");
    const modelCanvas = document.getElementById("model-graph");
    let vocabCard = null;
    const modelCtx = modelCanvas.getContext("2d");
    let modelProfile = null;
    const partColor = {
      embedding: "#d4531a",
      attention: "#e2a01a",
      mlp: "#2f6f4e",
      norm: "#7a6d5d",
      output: "#1a1612",
    };

    function comma(value) {
      return Number(value || 0).toLocaleString("en-US");
    }

    function drawParamSegments(ctx, profile, x, y, width, height, withLabels) {
      const parts = profile.parts || [];
      const total = parts.reduce((sum, part) => sum + part.parameters, 0) || 1;
      let cursor = x;
      parts.forEach((part, index) => {
        const share = part.parameters / total * width;
        const seg = index === parts.length - 1 ? x + width - cursor : Math.max(share, part.parameters ? 2 : 0);
        ctx.fillStyle = partColor[part.name] || "#7a6d5d";
        ctx.fillRect(cursor, y, seg, height);
        if (withLabels && seg > 64) {
          ctx.fillStyle = part.name === "mlp" || part.name === "output" ? "#fffaf1" : "#1a1612";
          ctx.font = "11px Consolas, monospace";
          ctx.textAlign = "left";
          ctx.textBaseline = "middle";
          ctx.fillText(part.name, cursor + 6, y + height / 2);
        }
        cursor += seg;
      });
    }

    function drawCardMark(ctx, card, profile, x, y, width, height) {
      if (width < 8 || height < 8) return;
      if (card.key === "model") {
        const nodes = [[0.16, 0.3], [0.5, 0.72], [0.84, 0.28]];
        ctx.strokeStyle = "#d4531a";
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        nodes.forEach((from, index) => {
          nodes.slice(index + 1).forEach((to) => {
            ctx.moveTo(x + from[0] * width, y + from[1] * height);
            ctx.lineTo(x + to[0] * width, y + to[1] * height);
          });
        });
        ctx.stroke();
        nodes.forEach(([px, py]) => {
          ctx.beginPath();
          ctx.fillStyle = "#d4531a";
          ctx.arc(x + px * width, y + py * height, 4, 0, Math.PI * 2);
          ctx.fill();
        });
        return;
      }
      if (card.key === "layers") {
        const counts = profile.perLayer || [];
        const n = Math.max(counts.length, 1);
        const gap = 3;
        const barW = (width - gap * (n - 1)) / n;
        const peak = Math.max(...counts, 1);
        counts.forEach((count, index) => {
          const barH = Math.max(6, (count / peak) * height);
          ctx.fillStyle = "#d4531a";
          ctx.fillRect(x + index * (barW + gap), y + height - barH, Math.max(2, barW), barH);
        });
        return;
      }
      if (card.key === "heads") {
        const n = profile.heads || 1;
        const radius = Math.min(7, width / (n * 2.6), height / 2);
        for (let index = 0; index < n; index++) {
          ctx.beginPath();
          ctx.fillStyle = index % 2 ? "#e2a01a" : "#d4531a";
          ctx.arc(x + radius + index * (radius * 2 + 6), y + height / 2, radius, 0, Math.PI * 2);
          ctx.fill();
        }
        return;
      }
      if (card.key === "embedding" || card.key === "vocabulary") {
        const scale = Math.max(profile.embedding, profile.vocabulary, 1);
        const value = card.key === "embedding" ? profile.embedding : profile.vocabulary;
        ctx.fillStyle = card.key === "embedding" ? "#d4531a" : "#2f6f4e";
        ctx.fillRect(x, y + height / 2 - 5, Math.max(4, value / scale * width), 10);
        return;
      }
      if (card.key === "parameters") {
        drawParamSegments(ctx, profile, x, y + height / 2 - 5, width, 10, false);
      }
    }

    function drawModelGraph() {
      if (!modelProfile) return;
      const rect = modelCanvas.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      const pixelW = Math.max(1, Math.floor(rect.width * dpr));
      const pixelH = Math.max(1, Math.floor(rect.height * dpr));
      if (modelCanvas.width !== pixelW || modelCanvas.height !== pixelH) {
        modelCanvas.width = pixelW;
        modelCanvas.height = pixelH;
      }
      modelCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
      const width = rect.width;
      const height = rect.height;
      modelCtx.clearRect(0, 0, width, height);
      const profile = modelProfile;
      const cards = [
        { key: "model", label: "model", value: profile.model },
        { key: "layers", label: "layers", value: String(profile.layers) },
        { key: "parameters", label: "parameters", value: comma(profile.parameters) },
        { key: "heads", label: "heads", value: String(profile.heads) },
        { key: "embedding", label: "embedding", value: String(profile.embedding) },
        { key: "vocabulary", label: "vocabulary", value: comma(profile.vocabulary) },
      ];
      const pad = 10;
      const gap = 8;
      const narrow = width < 780;
      const columns = narrow ? 3 : 6;
      const rows = narrow ? 2 : 1;
      const legendH = 34;
      const barH = 16;
      const barTop = height - legendH - barH - 4;
      const cardH = (barTop - 8 - gap * (rows - 1)) / rows;
      const cardW = (width - pad * 2 - gap * (columns - 1)) / columns;
      cards.forEach((card, index) => {
        const x = pad + (index % columns) * (cardW + gap);
        const y = 4 + Math.floor(index / columns) * (cardH + gap);
        modelCtx.fillStyle = "rgba(255, 250, 241, 0.94)";
        const wordsOpen = stage.classList.contains("show-words");
        modelCtx.strokeStyle = card.key === "vocabulary" && wordsOpen ? "#d4531a" : "#d9cbb3";
        modelCtx.lineWidth = card.key === "vocabulary" && wordsOpen ? 2 : 1;
        modelCtx.beginPath();
        modelCtx.roundRect(x, y, cardW, cardH, 8);
        modelCtx.fill();
        modelCtx.stroke();
        if (card.key === "vocabulary") {
          vocabCard = { x, y, w: cardW, h: cardH };
          modelCanvas.vocabRect = vocabCard;
        }
        modelCtx.save();
        modelCtx.beginPath();
        modelCtx.rect(x + 2, y + 2, cardW - 4, cardH - 4);
        modelCtx.clip();
        modelCtx.fillStyle = "#7a6d5d";
        modelCtx.font = "12px Consolas, monospace";
        modelCtx.textAlign = "left";
        modelCtx.textBaseline = "alphabetic";
        modelCtx.fillText(card.label, x + 8, y + 16);
        modelCtx.fillStyle = "#1a1612";
        modelCtx.font = "16px Palatino Linotype, Palatino, Georgia, serif";
        modelCtx.fillText(card.value, x + 8, y + 36);
        drawCardMark(modelCtx, card, profile, x + 8, y + 44, cardW - 16, Math.max(8, cardH - 52));
        modelCtx.restore();
      });
      drawParamSegments(modelCtx, profile, pad, barTop, width - pad * 2, barH, true);
      modelCtx.font = "11px Consolas, monospace";
      modelCtx.textAlign = "left";
      modelCtx.textBaseline = "alphabetic";
      let legendX = pad;
      let legendY = barTop + barH + 14;
      (profile.parts || []).forEach((part) => {
        const text = `${part.name} ${comma(part.parameters)}`;
        const textW = modelCtx.measureText(text).width;
        if (legendX > pad && legendX + 12 + textW > width - pad) {
          legendX = pad;
          legendY += 14;
        }
        modelCtx.fillStyle = partColor[part.name] || "#7a6d5d";
        modelCtx.fillRect(legendX, legendY - 8, 8, 8);
        modelCtx.fillStyle = "#1a1612";
        modelCtx.fillText(text, legendX + 12, legendY);
        legendX += textW + 22;
      });
      modelCanvas.setAttribute(
        "aria-label",
        `Model ${profile.model}. ${profile.layers} layers. ${comma(profile.parameters)} parameters. ${profile.heads} heads. Embedding ${profile.embedding}. Vocabulary ${comma(profile.vocabulary)}.`,
      );
    }

    function pointInVocabCard(event) {
      if (!vocabCard) return false;
      const bounds = modelCanvas.getBoundingClientRect();
      const x = event.clientX - bounds.left;
      const y = event.clientY - bounds.top;
      return x >= vocabCard.x && x <= vocabCard.x + vocabCard.w && y >= vocabCard.y && y <= vocabCard.y + vocabCard.h;
    }

    function toggleVocabulary() {
      stage.classList.toggle("show-words");
      const open = stage.classList.contains("show-words");
      document.getElementById("vocab").setAttribute("aria-hidden", open ? "false" : "true");
      if (modelProfile) drawModelGraph();
    }

    modelCanvas.addEventListener("click", (event) => {
      if (pointInVocabCard(event)) toggleVocabulary();
    });
    modelCanvas.addEventListener("mousemove", (event) => {
      modelCanvas.style.cursor = pointInVocabCard(event) ? "pointer" : "";
    });
    document.getElementById("vocab-count").addEventListener("click", toggleVocabulary);

    function showVocabulary(words) {
      const count = document.getElementById("vocab-count");
      const list = document.getElementById("vocab-list");
      count.textContent = `Vocabulary · ${words.length} words`;
      list.replaceChildren();
      words.forEach((word, index) => {
        const chip = document.createElement("span");
        chip.className = word.startsWith("<") && word.endsWith(">") ? "word special" : "word";
        chip.textContent = word;
        chip.title = `token ${index}`;
        list.appendChild(chip);
      });
    }

    async function loadModelGraph() {
      const urls = ["/api/model", new URL("model.json", document.baseURI).href];
      for (const url of urls) {
        try {
          const response = await fetch(url);
          if (!response.ok) continue;
          modelProfile = await response.json();
          break;
        } catch (error) {
          continue;
        }
      }
      if (!modelProfile) {
        statusEl.textContent = "The model graph could not load.";
        return;
      }
      drawModelGraph();
      showVocabulary(modelProfile.words || []);
      if (useBrowserModel()) {
        statusEl.textContent = "The model runs in this browser. Ask a question below.";
      }
    }

    window.addEventListener("resize", drawModelGraph);
    loadModelGraph();
    restoreSession();
  </script>
</body>
</html>
